<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zia's day- AI schedule planner</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 900px; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 20px; }
        h2 { margin: 0 0 10px 0; color: #38bdf8; text-align: center; }
        .input-section { display: flex; flex-direction: column; gap: 10px; background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
        textarea { width: 100%; height: 80px; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; resize: none; outline: none; font-family: inherit; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; align-self: flex-end; }
        button:hover { background: #2563eb; }
        .schedule-output { background: #0f172a; border: 1px solid #334155; padding: 16px; border-radius: 8px; min-height: 250px; overflow-x: auto; color: #cbd5e1; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #334155; padding: 10px 12px; text-align: left; }
        th { background: #1e293b; color: #38bdf8; }
        tr:nth-child(even) { background: #131c31; }
        .loading { color: #facc15; font-style: italic; }
    </style>
    <!-- Include Marked.js to automatically convert Markdown to HTML tables -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <h2>AI Smart Schedule Planner</h2>
        
        <div class="input-section">
            <label for="task-input"><strong>What tasks or goals do you want to plan today?</strong></label>
            <textarea id="task-input" placeholder="e.g., Study for 5 hours, gym, lunch, and 1 hour gaming..."></textarea>
            <button onclick="generateSchedule()">Generate Smart Schedule</button>
        </div>

        <div>
            <h3>Your Optimized Schedule:</h3>
            <div id="schedule-box" class="schedule-output">Your generated schedule will appear here...</div>
        </div>
    </div>

    <script>
        async function generateSchedule() {
            const input = document.getElementById('task-input');
            const scheduleBox = document.getElementById('schedule-box');
            const tasks = input.value.trim();
            
            if (!tasks) return;

            const prompt = `Act as an expert time-management assistant. Take these tasks/goals and output your response containing a clean Markdown table with columns 'Timings' and 'What to Do'. Keep the explanations concise so the table looks neat:\n\n${tasks}`;

            scheduleBox.innerHTML = '<span class="loading">AI is organizing your schedule... Please wait...</span>';

            try {
                const response = await fetch('http://localhost:8080/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                
                const reply = await response.text();
                // Render markdown table directly into gorgeous HTML table
                scheduleBox.innerHTML = marked.parse(reply);
            } catch (err) {
                scheduleBox.innerHTML = '<span style="color: red;">Error: Could not connect to backend server. Make sure Spring Boot is running!</span>';
            }
        }
    </script>
</body>
</html>
